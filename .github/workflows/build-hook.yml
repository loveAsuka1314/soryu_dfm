name: Build preload hook
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 hook
        run: |
          set -euo pipefail
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -shared -fPIC -O2 -o hook.so hook.c -ldl
          ls -la hook.so
          file hook.so || true
      - uses: actions/upload-artifact@v4
        with:
          name: hook
          path: hook.so
          if-no-files-found: error
